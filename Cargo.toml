[package]
name = "wipac-disk-tracking"
version = "0.5.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = [ "erased-json" ] }
axum-keycloak-auth = "0.8.3"
chrono = "0.4.45"
env_logger = "0.11.11"
futures-util = "0.3.34"
gotham = "0.7.4"
gotham_restful = "0.9.1"
log = "0.4.34"
mongodb = "3.9.1"
serde = "1.0.229"
serde_json = "1.0.151"
time = "0.3.55"
tokio = { version = "1.53.1", features = [ "full" ] }
uuid = { version = "1.26.1", features = [ "serde", "v4" ] }

[lib]
name = "wipac_disk_tracking"
path = "src/lib.rs"
